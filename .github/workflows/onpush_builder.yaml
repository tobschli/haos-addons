name: Build add-on images

# Builds add-on images for every addon folder under `config.yaml`-based
# folders that changed in this push, and pushes per-arch images to ghcr.io,
# tagged with the add-on version. Supervisor deploys them via the `image:`
# field in each folder's config.yaml — nothing is built on the HA device.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GHCR: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build changed add-ons
        run: |
          for dir in */; do
            dir="${dir%/}"
            [ -f "${dir}/config.yaml" ] || continue
            if git rev-parse --verify --quiet HEAD~1 >/dev/null && git diff --quiet HEAD~1 HEAD -- "${dir}"; then
              echo "== ${dir}: unchanged, skipping"
              continue
            fi
            ver="$(grep -m1 '^version:' "${dir}/config.yaml" | sed 's/.*"\(.*\)".*/\1/')"
            echo "== Building ${dir} ${ver}"
            for arch in amd64 aarch64; do
              [ "$arch" = aarch64 ] && platform="linux/arm64" || platform="linux/${arch}"
              docker buildx build \
                --platform "${platform}" \
                --file "${dir}/Dockerfile" \
                --tag "${GHCR}/${dir}-${arch}:${ver}" \
                --tag "${GHCR}/${dir}-${arch}:latest" \
                --push "${dir}"
            done
          done
